name: Build PS3 EBOOT

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependencies & Compile
              run: |
                  sudo apt update
                  # SDL2 ile birlikte yazı tipi (ttf) kütüphanesini de kuruyoruz
                  sudo apt install -y build-essential git wget make libsdl2-dev libsdl2-ttf-dev
                  
                  ls -la
                  
                  # SDL2 ve TTF kütüphane bayraklarıyla derleme
                  g++ -O3 main.cpp -o eboot.elf $(sdl2-config --cflags --libs) -lSDL2_ttf

            - name: Upload EBOOT Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PS3-EBOOT
                  path: eboot.elf
