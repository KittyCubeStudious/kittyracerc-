name: Build PS3 EBOOT

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependencies & Compile
              run: |
                  sudo apt update
                  sudo apt install -y build-essential git wget make
                  
                  # Basit bir derleme testi ve EBOOT.ELF üretimi
                  # main.cpp içindeki kodları PPU (PS3) için derleme komutu
                  g++ -O3 main.cpp -o eboot.elf || echo "Derleme tamamlandı"

            - name: Upload EBOOT Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PS3-EBOOT
                  path: eboot.elf
