name: Build PS3 EBOOT

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependencies & Compile
              run: |
                  sudo apt update
                  # SDL2 kütüphanesini ve derleme araçlarını eksiksiz kuruyoruz
                  sudo apt install -y build-essential git wget make libsdl2-dev
                  
                  # Dosyaların yerinde olduğunu kontrol edip derlemeyi başlatıyoruz
                  ls -la
                  
                  # SDL2 bayraklarıyla birlikte C++ derlemesi
                  g++ -O3 main.cpp -o eboot.elf $(sdl2-config --cflags --libs)

            - name: Upload EBOOT Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PS3-EBOOT
                  path: eboot.elf
