name: Build PS3 EBOOT

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependencies & Compile
              run: |
                  sudo apt update
                  sudo apt install -y build-essential git wget make
                  
                  # Repo içindeki dosyaları listeleyelim ki nerede olduğunu görelim
                  ls -la
                  
                  # C++ derlemesini çalıştıralım (Eğer dosya adı main.cpp ise)
                  g++ -O3 main.cpp -o eboot.elf

            - name: Upload EBOOT Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PS3-EBOOT
                  path: eboot.elf
